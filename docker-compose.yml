# La stack complete sur le poste du developpeur : les images sont CONSTRUITES ici.
# Lancement : cp .env.example .env, puis docker compose up --build
# Le site : http://localhost:8080 (FRONT_PORT dans le .env)

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: taskmanager
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      # Les donnees survivent au conteneur.
      - db_data:/var/lib/mysql
    ports:
      # 3307 cote poste : 3306 y est souvent deja pris.
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      # $$ : la variable est lue dans le conteneur, pas par Compose.
      test: mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD
      interval: 5s
      retries: 20

  api:
    build: ./api
    environment:
      # "db" : le nom du service, pas localhost.
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/taskmanager
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    depends_on:
      db:
        # Attendre que MySQL reponde, pas seulement qu'il demarre.
        condition: service_healthy
    ports:
      # Pratique pour Postman ; le front, lui, passe par /api.
      - "${API_PORT:-3000}:3000"

  front:
    build: ./front
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONT_PORT:-8080}:80"

volumes:
  db_data:
