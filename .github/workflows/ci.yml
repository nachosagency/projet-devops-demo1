# Integration continue : a chaque push et a chaque pull request.
# Qualite du code, tests, puis fabrication et publication des images (le livrable).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Et a la main, bouton « Run workflow » dans l'onglet Actions : pratique en demo.
  workflow_dispatch:

# Par defaut, le workflow ne peut que lire le depot.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Qualite
  qualite:
    name: Qualité du code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - name: Lint (ESLint)
        run: npm run lint
      - name: Typage (TypeScript)
        run: npx tsc --noEmit

  # ---------------------------------------------------------------- Tests
  tests:
    name: Tests
    runs-on: ubuntu-latest
    # Une vraie base MySQL, lancee par GitHub pour la duree du job.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: taskmanager
          MYSQL_ROOT_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci"
          --health-interval=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:mauvais@127.0.0.1:3306/taskmanager
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - name: Migrations de la base de test
        run: npx prisma migrate deploy
      - name: Tests unitaires et d'intégration
        run: npm test -- --coverage

      # Le rapport de couverture est garde, meme si les tests echouent.
      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: couverture
          path: api/coverage/

  # ---------------------------------------------------------------- Front
  front:
    name: Build du front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run build

  # ---------------------------------------------------------------- Livrable
  images:
    name: Images Docker
    # Seulement si tout le reste est vert, et seulement sur un push (pas sur une PR).
    needs: [qualite, tests, front]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # le droit de publier sur GHCR
    steps:
      - uses: actions/checkout@v7

      # GHCR exige un nom en minuscules ; le tag est le debut du commit.
      - name: Nom et version des images
        id: nom
        run: |
          echo "prefixe=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN est fourni automatiquement : aucun secret a creer.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image de l'API
        uses: docker/build-push-action@v7
        with:
          context: api
          push: true
          build-args: APP_VERSION=${{ steps.nom.outputs.tag }}
          tags: |
            ${{ steps.nom.outputs.prefixe }}-api:${{ steps.nom.outputs.tag }}
            ${{ steps.nom.outputs.prefixe }}-api:${{ github.ref_name }}

      - name: Image du front
        uses: docker/build-push-action@v7
        with:
          context: front
          push: true
          tags: |
            ${{ steps.nom.outputs.prefixe }}-front:${{ steps.nom.outputs.tag }}
            ${{ steps.nom.outputs.prefixe }}-front:${{ github.ref_name }}
