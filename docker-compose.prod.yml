# La stack sur un serveur : RIEN n'est construit ici. On recupere les images que
# la CI a publiees sur GHCR, a la version TAG choisie par deploy.sh.
# Un dossier par environnement (staging, production), chacun avec son .env.

name: taskmanager-${ENVIRONNEMENT}

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taskmanager
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    # Pas de "ports" : la base n'est joignable que par l'API, jamais depuis Internet.
    healthcheck:
      # $$ : la variable est lue dans le conteneur, pas par Compose.
      test: mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD
      interval: 5s
      retries: 20

  api:
    image: ${IMAGE_PREFIX}-api:${TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/taskmanager
    depends_on:
      db:
        condition: service_healthy
    # Pas de "ports" non plus : on passe par le front.

  front:
    image: ${IMAGE_PREFIX}-front:${TAG}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONT_PORT}:80"

volumes:
  db_data:
