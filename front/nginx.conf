server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Les appels /api/... sont relayes au service "api" du docker compose.
    # Le navigateur ne parle qu'au front : une seule adresse, pas de CORS.
    location /api/ {
        proxy_pass http://api:3000/;
    }

    # Une application d'une seule page : toute URL inconnue renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
